<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析结果</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>三维航迹误差分析结果</h1><dl><dt>任务编号</dt><dd th:text="${task.taskId}"></dd><dt>状态</dt><dd th:text="${task.status}"></dd><dt>开始时间</dt><dd th:text="${task.startedAt}"></dd><dt>完成时间</dt><dd th:text="${task.finishedAt}"></dd></dl><div class="table-wrap"><table><tbody><tr><th>点数</th><td th:text="${result.pointCount}"></td></tr><tr><th>平均误差</th><td th:text="${result.meanError}"></td></tr><tr><th>RMSE</th><td th:text="${result.rmse}"></td></tr><tr><th>最小 / 最大误差</th><td th:text="${result.minError + ' / ' + result.maxError}"></td></tr><tr><th>标准差</th><td th:text="${result.standardDeviation}"></td></tr><tr><th>异常点 / 比例</th><td th:text="${result.abnormalCount + ' / ' + result.abnormalRatio}"></td></tr></tbody></table></div><a class="button" th:href="@{/app/tasks/{id}/result.csv(id=${task.taskId})}">下载结果 CSV</a></main></body></html>
