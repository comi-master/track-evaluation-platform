<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>审计日志</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>审计日志</h1><form method="get"><input name="username" th:value="${username}" placeholder="用户"><input name="action" th:value="${action}" placeholder="动作"><button>筛选</button></form><table><thead><tr><th>时间</th><th>用户</th><th>动作</th><th>资源</th><th>IP</th><th>请求 ID</th><th>详情</th></tr></thead><tbody><tr th:each="row:${page.records}"><td th:text="${row.createdAt}"></td><td th:text="${row.usernameSnapshot}"></td><td th:text="${row.action}"></td><td th:text="${row.resourceType + ':' + row.resourceId}"></td><td th:text="${row.ipAddress}"></td><td th:text="${row.requestId}"></td><td th:text="${row.detail}"></td></tr></tbody></table></main></body></html>
