spring:
  application:
    name: track-analysis-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  servlet:
    multipart:
      max-file-size: ${TRACK_FILE_MAX_SIZE_BYTES:20971520}B
      max-request-size: ${TRACK_REQUEST_MAX_SIZE_BYTES:22020096}B

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:track-files}

track:
  analysis:
    batch-size: ${ANALYSIS_BATCH_SIZE:1000}
  file:
    max-size-bytes: ${TRACK_FILE_MAX_SIZE_BYTES:20971520}
    max-rows: ${TRACK_FILE_MAX_ROWS:200000}
    batch-size: ${TRACK_FILE_BATCH_SIZE:500}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:track-analysis-platform}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    milestone: 4

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
