<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>创建用户</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>创建用户</h1><form method="post" th:action="@{/admin/users}" th:object="${form}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>用户名<input th:field="*{username}" required maxlength="64"></label><label>显示名<input th:field="*{displayName}" maxlength="100"></label><label>邮箱<input type="email" th:field="*{email}" maxlength="254"></label><label>密码<input type="password" th:field="*{password}" required minlength="12" maxlength="128"></label><label>角色<select th:field="*{role}"><option value="RESEARCHER">研究员</option><option value="ADMIN">管理员</option></select></label><button>创建</button></form></main></body></html>
