<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>用户管理</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><strong>用户管理</strong><nav><a th:href="@{/app/dashboard}">仪表盘</a><a th:href="@{/admin/audit-logs}">审计</a></nav></header><main><h1>用户</h1><p class="success" th:if="${success}" th:text="${success}"></p><a th:href="@{/admin/users/new}">创建用户</a><form method="get"><input name="keyword" th:value="${keyword}"><button>搜索</button></form><table><thead><tr><th>用户名</th><th>姓名</th><th>邮箱</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="u:${page.records}"><td><a th:href="@{/admin/users/{id}(id=${u.id})}" th:text="${u.username}"></a></td><td th:text="${u.displayName}"></td><td th:text="${u.email}"></td><td th:text="${u.status}"></td><td><form method="post" th:action="@{/admin/users/{id}/enabled(id=${u.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${u.status != 'ACTIVE'}"><button th:text="${u.status == 'ACTIVE' ? '禁用' : '启用'}"></button></form></td></tr></tbody></table></main></body></html>
