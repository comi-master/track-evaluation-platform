<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · 航迹仿真评测平台</title><link rel="stylesheet" th:href="@{/css/app.css}"><style>.login-body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f7fb,#f5f8fc)}.login-card{width:min(420px,calc(100% - 2rem));padding:2rem}.login-card h1{margin:.5rem 0}.login-card p{color:#64748b}.login-mark{display:grid;place-items:center;width:3rem;height:3rem;border-radius:12px;background:#42d9c8;color:#123352;font-weight:900;font-size:1.4rem}.login-card form{margin-top:1.5rem}.login-card button{width:100%;margin-top:.7rem}.alert{padding:.75rem;border-radius:8px;background:#e9f3f7;color:#175b74;margin:.75rem 0}.alert.error{background:#fff0f0;color:#a33}.alert.success{background:#e7f6ed;color:#176b3a}.login-link{text-align:center}.login-link a{color:#087f8c;font-weight:700}.field-error{color:#b42318;font-size:.8rem;font-weight:400}</style></head>
<body class="login-body"><main class="card login-card"><div class="login-mark">T</div><h1>创建新用户</h1><p>注册后即可创建自己的仿真场景并保存评测历史</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}" th:object="${registrationForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>用户名<input th:field="*{username}" autocomplete="username" required maxlength="64"><small class="field-error" th:errors="*{username}"></small></label><label>密码<input type="password" th:field="*{password}" autocomplete="new-password" required minlength="8" maxlength="64"><small class="field-error" th:errors="*{password}"></small></label><label>确认密码<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required><small class="field-error" th:errors="*{confirmPassword}"></small></label><button type="submit">注册账号</button></form><p class="login-link">已有账号？<a th:href="@{/login}">返回登录</a></p></main></body></html>
