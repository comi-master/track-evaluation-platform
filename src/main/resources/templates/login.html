<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 航迹仿真评测平台</title><link rel="stylesheet" th:href="@{/css/app.css}"><style>.login-body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f7fb,#f5f8fc)}.login-card{width:min(420px,calc(100% - 2rem));padding:2rem}.login-card h1{margin:.5rem 0}.login-card p{color:#64748b}.login-mark{display:grid;place-items:center;width:3rem;height:3rem;border-radius:12px;background:#42d9c8;color:#123352;font-weight:900;font-size:1.4rem}.login-card form{margin-top:1.5rem}.login-card button{width:100%;margin-top:.7rem}.alert{padding:.75rem;border-radius:8px;background:#e9f3f7;color:#175b74;margin:.75rem 0}.alert.error{background:#fff0f0;color:#a33}.alert.success{background:#e7f6ed;color:#176b3a}.login-link{text-align:center}.login-link a{color:#087f8c;font-weight:700}.field-error{color:#b42318;font-size:.8rem;font-weight:400}</style></head>
<body class="login-body"><main class="card login-card"><div class="login-mark">T</div><h1>航迹仿真评测平台</h1><p>登录后管理仿真场景并评测算法结果</p><div class="alert error" th:if="${param.error}">用户名或密码错误，或账号已被禁用。</div><div class="alert" th:if="${param.logout}">已安全退出。</div><div class="alert" th:if="${param.expired}">会话已失效，请重新登录。</div><div class="alert success" th:if="${param.registered}">注册成功，请使用新账号登录。</div><div class="alert success" th:if="${param.passwordChanged}">密码已修改，请重新登录。</div><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">登录</button></form><p class="login-link">还没有账号？<a th:href="@{/register}">注册新用户</a></p></main></body></html>
