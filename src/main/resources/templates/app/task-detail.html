<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务详情</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main id="task" th:attr="data-status-url=@{/app/tasks/{id}/status(id=${task.taskId})},data-terminal=${task.status.name() == 'SUCCESS' || task.status.name() == 'FAILED' || task.status.name() == 'CANCELLED'}"><h1>任务 <span th:text="${task.taskId}"></span></h1><dl><dt>状态</dt><dd id="task-status" th:text="${task.status}"></dd><dt>阈值</dt><dd th:text="${task.abnormalThreshold}"></dd><dt>尝试次数</dt><dd th:text="${task.attemptCount + '/' + task.maxAttempts}"></dd><dt>开始时间</dt><dd th:text="${task.startedAt ?: '-'}"></dd><dt>完成时间</dt><dd th:text="${task.finishedAt ?: '-'}"></dd><dt>错误</dt><dd class="break-word" th:text="${task.safeErrorMessage ?: '-'}"></dd></dl><a class="button" th:if="${task.analysisResultId != null}" th:href="@{/app/tasks/{id}/result(id=${task.taskId})}">查看结果</a><form th:if="${task.status.name() == 'FAILED'}" method="post" th:action="@{/app/tasks/{id}/retry(id=${task.taskId})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>重试</button></form><form th:if="${task.status.name() == 'PENDING'}" method="post" th:action="@{/app/tasks/{id}/cancel(id=${task.taskId})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="danger">取消任务</button></form></main><script>const root=document.querySelector('#task');if(root.dataset.terminal==='false'){const poll=()=>fetch(root.dataset.statusUrl,{headers:{Accept:'application/json'}}).then(r=>r.ok?r.json():Promise.reject()).then(v=>{document.querySelector('#task-status').textContent=v.status;if(['SUCCESS','FAILED','CANCELLED'].includes(v.status))location.reload();else setTimeout(poll,1500)}).catch(()=>setTimeout(poll,3000));setTimeout(poll,1000)}</script></body></html>
