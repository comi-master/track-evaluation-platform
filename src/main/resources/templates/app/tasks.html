<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析任务</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header><strong>航迹分析平台</strong><nav><a th:href="@{/app/dashboard}">仪表盘</a><a th:href="@{/app/datasets}">数据集</a></nav></header><main>
<h1 th:text="${fileId == null ? '全局分析任务' : '文件 ' + fileId + ' 的分析任务'}"></h1>
<form method="get" class="filter-grid"><input th:if="${fileId != null}" type="hidden" name="fileId" th:value="${fileId}"><label>状态<select name="status"><option value="">全部</option><option th:each="s:${T(com.example.trackanalysis.task.domain.AnalysisTaskStatus).values()}" th:value="${s}" th:text="${s}" th:selected="${s==status}"></option></select></label><label th:if="${identity.roles.contains('ADMIN')}">创建人 ID<input type="number" min="1" name="ownerId" th:value="${ownerId}"></label><button>筛选</button></form>
<form th:if="${fileId != null}" method="post" th:action="@{/app/tasks}" class="form-card"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="fileId" th:value="${fileId}"><label>异常阈值<input type="number" step="0.01" min="0" name="threshold" value="10"></label><button>创建异步任务</button></form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>文件</th><th>状态</th><th>尝试</th><th>创建时间</th></tr></thead><tbody><tr th:each="task:${page.records}"><td><a th:href="@{/app/tasks/{id}(id=${task.taskId})}" th:text="${task.taskId}"></a></td><td th:text="${task.fileId}"></td><td th:text="${task.status}"></td><td th:text="${task.attemptCount + '/' + task.maxAttempts}"></td><td th:text="${task.createdAt}"></td></tr></tbody></table></div>
</main></body></html>
