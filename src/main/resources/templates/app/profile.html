<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户信息 · 航迹仿真评测平台</title><link rel="stylesheet" th:href="@{/css/app.css}"><style>.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}.profile-form{display:grid;gap:.3rem}.profile-form .form-actions{margin-top:.5rem}@media(max-width:800px){.profile-grid{grid-template-columns:1fr}}</style></head>
<body>
<header class="site-header"><a class="brand" th:href="@{/app/simulator}"><span class="brand-mark">T</span><span>航迹仿真评测平台<small>Trajectory evaluation lab</small></span></a><nav><a th:href="@{/app/simulator}">生成数据</a><a th:href="@{/app/history}">历史结果</a><a class="active" th:href="@{/app/profile}">用户信息</a></nav></header>
<main class="shell"><section class="hero compact"><span class="eyebrow">ACCOUNT CENTER</span><h1>用户信息</h1><p>查看账号状态，修改个人资料和登录密码。</p></section>
<div class="profile-grid"><section class="card"><div class="section-heading"><div><span class="eyebrow">PROFILE</span><h2>基本信息</h2></div><span class="badge" th:text="${identity.primaryRole}">RESEARCHER</span></div><form method="post" th:action="@{/app/profile}" class="profile-form"><label>用户名 <span class="hint">用户名不可修改</span><input th:value="${identity.username}" readonly></label><label>显示名称<input name="displayName" maxlength="100" th:value="${identity.displayName ?: ''}" placeholder="填写你的显示名称"></label><label>邮箱<input type="email" name="email" maxlength="254" th:value="${identity.email ?: ''}" placeholder="name@example.com"></label><div class="form-actions"><button class="primary-action" type="submit">保存用户信息</button></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form><p class="success" th:if="${success}" th:text="${success}"></p></section>
<section class="card"><div class="section-heading"><div><span class="eyebrow">SECURITY</span><h2>修改密码</h2></div></div><p class="muted">修改密码后当前登录会话将失效，需要重新登录。</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/app/change-password}" th:object="${form}" class="profile-form"><label>当前密码<input type="password" th:field="*{currentPassword}" maxlength="128" autocomplete="current-password" required></label><label>新密码 <span class="hint">长度 12-128 位</span><input type="password" th:field="*{newPassword}" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>确认新密码<input type="password" th:field="*{confirmPassword}" minlength="12" maxlength="128" autocomplete="new-password" required></label><button class="primary-action" type="submit">修改并重新登录</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></section></div></main>
<section class="card intro-strip"><div class="intro-icon">04</div><div><b>你的实验空间</b><p>仿真场景、上传文件和评测结果都按当前账号隔离保存，其他用户无法查看你的实验数据。</p></div><div class="intro-chip">账号隔离 · 安全保存</div></section></body></html>
