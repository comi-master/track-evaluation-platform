spring:
  application:
    name: track-analysis-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${MYSQL_POOL_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  servlet:
    multipart:
      max-file-size: ${TRACK_FILE_MAX_SIZE_BYTES:20971520}B
      max-request-size: ${TRACK_REQUEST_MAX_SIZE_BYTES:22020096}B
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}
        acknowledge-mode: manual
        default-requeue-rejected: false
        concurrency: ${RABBITMQ_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:8}
        prefetch: ${RABBITMQ_PREFETCH:1}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
  session:
    timeout: ${WEB_SESSION_TIMEOUT:30m}
    redis:
      namespace: track-analysis:web-session
      repository-type: indexed

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:track-files}

track:
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    poll-milliseconds: ${OUTBOX_POLL_MILLISECONDS:250}
  analysis:
    batch-size: ${ANALYSIS_BATCH_SIZE:1000}
  task:
    max-attempts: ${ANALYSIS_TASK_MAX_ATTEMPTS:3}
    retry-delay-milliseconds: ${ANALYSIS_RETRY_DELAY_MILLISECONDS:5000}
    lease-duration-milliseconds: ${ANALYSIS_TASK_LEASE_MILLISECONDS:30000}
    heartbeat-interval-milliseconds: ${ANALYSIS_TASK_HEARTBEAT_MILLISECONDS:5000}
  cache:
    latest-ttl: ${ANALYSIS_LATEST_CACHE_TTL:PT10M}
    comparison-ttl: ${ANALYSIS_COMPARISON_CACHE_TTL:PT5M}
  file:
    max-size-bytes: ${TRACK_FILE_MAX_SIZE_BYTES:20971520}
    max-rows: ${TRACK_FILE_MAX_ROWS:200000}
    batch-size: ${TRACK_FILE_BATCH_SIZE:500}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:track-analysis-platform}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}

app:
  auth:
    public-registration-enabled: ${APP_PUBLIC_REGISTRATION_ENABLED:true}
    admin-username: ${APP_ADMIN_USERNAME:}
    admin-password: ${APP_ADMIN_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${WEB_SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    milestone: 6

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
