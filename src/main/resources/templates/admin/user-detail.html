<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>用户详情</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header><strong>用户详情</strong><nav><a th:href="@{/admin/users}">返回用户列表</a></nav></header><main><h1 th:text="${details.user.username}"></h1><p class="success" th:if="${success}" th:text="${success}"></p><dl><dt>状态</dt><dd th:text="${details.user.status}"></dd><dt>角色</dt><dd th:text="${#strings.listJoin(details.roles, ', ')}"></dd><dt>最后登录</dt><dd th:text="${details.user.lastLoginAt ?: '-'}"></dd><dt>创建时间</dt><dd th:text="${details.user.createdAt}"></dd></dl><form method="post" th:action="@{/admin/users/{id}(id=${details.user.id})}" th:object="${form}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>姓名<input th:field="*{displayName}" maxlength="100"></label><label>邮箱<input type="email" th:field="*{email}" maxlength="254"></label><label>角色<select th:field="*{role}"><option value="RESEARCHER">RESEARCHER</option><option value="ADMIN">ADMIN</option></select></label><button>保存</button></form><h2>管理员重置密码</h2><form method="post" th:action="@{/admin/users/{id}/password(id=${details.user.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>新密码<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>重置密码</button></form></main></body></html>
